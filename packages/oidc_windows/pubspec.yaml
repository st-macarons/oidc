name: oidc_windows
description: Windows implementation of the oidc plugin
version: 0.4.0
repository: https://github.com/Bdaya-Dev/oidc/tree/main/packages/oidc_windows
homepage: https://bdaya-dev.github.io/oidc/
resolution: workspace
environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.22.0"

flutter:
  plugin:
    implements: oidc
    platforms:
      windows:
        pluginClass: OidcWindows
        dartPluginClass: OidcWindows

dependencies:
  flutter:
    sdk: flutter
  logging: ^1.2.0
  oidc_core:
    path: ../oidc_core
  oidc_desktop:
    path: ../oidc_desktop
  oidc_platform_interface:
    path: ../oidc_platform_interface

dev_dependencies:
  flutter_test:
    sdk: flutter
  very_good_analysis: ^10.0.0
